<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Day - 26 | Drag & Drop</title>
    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
      integrity="sha512-Kc323vGBEqzTmouAECnVceyQqyqdsSiqLQISBL29aUW4U/M7pSPA/gEUZQqv1cwx4OnYxTxve5UMg5GT6L4JJg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  </head>

  <body>
    <div class="groups">
      <div class="group">
        <h2>Developers <i class="fa-solid fa-laptop-code"></i></h2>
        <div id="team-members">
          <article class="team-member">
            <img
              class="team-member-avatar width-part"
              src="Images/kiffu.png"
              alt="Aashish"
            />
            <div class="team-member-name">
              <h3>Aashish Meher</h3>
              <p>Frontend Expert</p>
            </div>
          </article>
          <article class="team-member">
            <img
              class="team-member-avatar width-part"
              src="Images/junaid.png"
              alt="Junaid Malik"
            />
            <div class="team-member-name">
              <h3>Junaid Malik</h3>
              <p>DSA Expert</p>
            </div>
          </article>
          <article class="team-member">
            <img
              class="team-member-avatar"
              src="Images/kashyap.png"
              alt="Kashyap Gohel"
            />
            <div class="team-member-name">
              <h3>Kashyap Gohel</h3>
              <p>UI/UX Designer</p>
            </div>
          </article>
          <article class="team-member">
            <img
              class="team-member-avatar"
              src="Images/tejas.png"
              alt="Tejas Lanjulkar"
            />
            <div class="team-member-name">
              <h3>Tejas Lanjulkar</h3>
              <p>Frontend Developer</p>
            </div>
          </article>
          <article class="team-member">
            <img
              class="team-member-avatar"
              src="Images/ash.png"
              alt="Ayush Kohre"
            />
            <div class="team-member-name">
              <h3>Ayush Kohre</h3>
              <p>Designer</p>
            </div>
          </article>
          <article class="team-member">
            <img class="team-member-avatar" src="Images/dev.jpg" alt="Dev" />
            <div class="team-member-name">
              <h3>Dev</h3>
              <p>Developer</p>
            </div>
          </article>
        </div>
      </div>
      <div class="group">
        <h2>Dev  <i class="fa-solid fa-code"></i> Mates</h2>
        <div id="my-team"></div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>
    <script src="script.js"></script>
  </body>
</html>
